name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "743186641954"
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STATE_BUCKET: terraform-state-743186641954-us-east-1
  STATE_KEY: terraform.tfstate

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubTerraformPlan

      - name: Verify AWS identity
        shell: bash
        run: |
          aws sts get-caller-identity
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$ACTUAL_ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Expected AWS account $AWS_ACCOUNT_ID, got $ACTUAL_ACCOUNT_ID"
            exit 1
          fi

      - name: Create or verify Terraform state bucket
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking bucket ownership: $STATE_BUCKET"
          OWNED=$(aws s3api list-buckets \
            --query "Buckets[?Name=='${STATE_BUCKET}'].Name | [0]" \
            --output text)

          if [[ "$OWNED" != "$STATE_BUCKET" ]]; then
            echo "Bucket not found in this AWS account. Attempting creation."
            aws s3api create-bucket \
              --bucket "$STATE_BUCKET" \
              --region "$AWS_REGION"
          else
            echo "Bucket already owned by this account."
          fi

          aws s3api head-bucket \
            --bucket "$STATE_BUCKET" \
            --expected-bucket-owner "$AWS_ACCOUNT_ID"

          aws s3api put-bucket-versioning \
            --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled \
            --expected-bucket-owner "$AWS_ACCOUNT_ID"

          echo "S3 state bucket is ready."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -reconfigure -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform Apply (production approval)
    runs-on: ubuntu-latest
    needs: plan
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubTerraformApply

      - name: Verify AWS identity
        shell: bash
        run: |
          aws sts get-caller-identity
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$ACTUAL_ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Expected AWS account $AWS_ACCOUNT_ID, got $ACTUAL_ACCOUNT_ID"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -reconfigure -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Terraform apply
        run: terraform apply -input=false tfplan
